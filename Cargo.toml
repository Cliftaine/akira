[package]
name = "forja"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
globset = "0.4.21"
ratatui = "0.30.2"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
shell-words = "1.1.1"
toml = "1.2.1"
walkdir = "2.5.0"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
